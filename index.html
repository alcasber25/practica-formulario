<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <title>Ejercicio de formulario - Registrarse en el club</title>
</head>
<body>
    <header>
    <h1>Regístrese en nuestro club</h1>
    <p>Siga todos estos pasos para ser miembro de nuestro club.</p>    
    </header>
    
 <formaction="/ruta/del/script" 
        method="post" 
        enctype="multipart/form-data" 
        target="_blank" 
        autocomplete="on" 
        novalidate 
        name="formularioDeRegistro" 
        accept-charset="UTF-8" 
        onsubmit="return validarFormulario()" 
        rel="noopener noreferrer">

    <fieldset>
    <legend><h2>Datos personales:</h2></legend>
        <label for="nombre">Nombres:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Escribe tus nombres" autofocus tabindex="1"><br><br>

        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos" placeholder="Escribe tus apellidos" tabindex="2"><br><br>
            
        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" min="0" max="120" placeholder="Ej:30" tabindex="3"><br>

        <p>Género:</p>
        <input type="radio" id="hombre" name="genero" value="hombre" tabindex="4">
        <label for="genero_hombre">Hombre</label><br>
        <input type="radio" id="mujer" name="genero" value="mujer" tabindex="5">
        <label for="genero_mujer">Mujer</label><br><br>

        <label for="suscribir">Me siento del club:</label>
        <input type="checkbox" id="suscribir" name="suscribir" value="sí" tabindex="6"><br><br>

        <label for="escribe algo sobre ti">Escribe algo sobre ti:</label>
        <textarea id="escribe algo sobre ti" name="comentarios" rows="3" cols="110" placeholder="Escribe lo que quieras." tabindex="7"></textarea>
    </fieldset>

    <fieldset>
        <legend><h2>Datos de contacto:</h2></legend>
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@dominio.com" tabindex="8"><br><br>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="+34 1234567890" tabindex="9"><br><br>
    
</fieldset>
<br>
        <input type="submit" value="Enviar" tabindex="10">
        <input type="reset" value="Reiniciar" tabindex="11">
    </form>

</body>
</html>
