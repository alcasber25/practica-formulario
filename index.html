<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <title>Ejercicio de formulario - Registrarse en el club</title>
</head>
<body>
    <header>
    <h1>Regístrese en nuestro club</h1>
    <p>Siga todos estos pasos para ser miembro de nuestro club.</p>    
    </header>
    
 <form 
        action="/ruta/del/script" 
        method="post" 
        enctype="multipart/form-data" 
        target="_blank" 
        autocomplete="on" 
        novalidate 
        name="formularioDeRegistro" 
        accept-charset="UTF-8" 
        onsubmit="return validarFormulario()" 
        rel="noopener noreferrer">

    <h2>Datos personales:</h2>

            <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre"><br><br>

            <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" name="apellidos" placeholder="Escribe tus apellidos"><br><br>
            
            <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" min="0" max="100"><br>

            <p>Género:</p>
                <input type="radio" id="hombre" name="genero" value="hombre">
                <label for="hombre">Hombre</label><br>
                <input type="radio" id="mujer" name="genero" value="mujer">
                <label for="mujer">Mujer</label><br><br>

            <label for="suscribir">Me siento del club:</label>
                <input type="checkbox" id="suscribir" name="suscribir" value="sí"><br><br>

            <label for="escribe algo sobre ti">Escribe algo sobre ti:</label>
                <textarea id="escribe algo sobre ti" name="comentarios" rows="4" cols="50" placeholder="Escribe lo que quieras."></textarea>

        <h2>Datos de contacto:</h2>
            <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@dominio.com"><br><br>

            <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" placeholder="123-456-7890"><br><br>

                <input type="submit" value="Enviar">
                <input type="reset" value="Reiniciar">

    </form>

</body>

</html>
